; Set Time & Weather FH2 settings. Read at game start; the in-game rows (Settings > Video, after Brightness and Subtitles) save Enabled, Hour and Weather here.
[TimeLock]
; 1 = hold the free-roam clock at Hour, 0 = normal day/night cycle (default).
Enabled=0
; 0-23.99 hours (18.5 = 18:30), HH:MM (18:30), or a preset name: Dawn, Noon, Sunset, Night.
Hour=Noon

[Weather]
; Free-roam weather, using the game's own weather options (the same list and values as the online event options):
;   Dynamic - the game's normal weather cycle (default; Time Lock changes nothing)
;   Sunny   - clear sky, dry roads
;   Wet     - overcast, damp roads, no rain
;   Rain    - rain, wet roads
;   Storm   - heavy rain, storm sky
; Races, car meets and events that set their own weather keep it; free roam returns to this afterwards.
; Also set in-game: Settings > Video > Weather ("Current" there is Dynamic).
Mode=Dynamic

[Presets]
; Hours for the Hour= preset names; change them freely.
Dawn=5:45
Noon=12:00
Sunset=17:50
Night=23:00

[Settings]
; 1 = add the Time of Day Lock, Locked Hour and Weather rows to Settings > Video (needs Extra Options' UI hook).
ShowInGameSettings=1
; Troubleshooting only: 1 = save a copy of the Video settings page as the game loads it
; (seen_A_VideoOptions.xaml, in this folder), to check why the rows did not appear. Default 0.
; The copy is your own game's file: don't share or redistribute it.
SaveSettingsPageCopy=0
